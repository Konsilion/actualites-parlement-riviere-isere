<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actualités — Parlement de la rivière Isère</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="layout">
    <section class="content" aria-label="Actualités">
      <div class="content-header">
        <span id="result-count" class="result-count">— actualités</span>
        <div class="toolbar">
          <div class="filters">
            <input
              type="search"
              id="search"
              class="search-input"
              placeholder="Titre, mot-clé, lieu…"
              autocomplete="off"
              aria-label="Rechercher dans les actualités"
            />
            <div class="fdropdown" id="year-dropdown">
              <button
                type="button"
                id="year-toggle"
                class="f-toggle"
                aria-expanded="false"
                aria-haspopup="listbox"
              >
                <span class="f-pill" id="year-pill">Toutes les années</span>
                <span class="f-caret" aria-hidden="true">▾</span>
              </button>
              <div
                id="year-menu"
                class="f-menu"
                role="listbox"
                aria-multiselectable="true"
              ></div>
            </div>
            <div class="fdropdown" id="month-dropdown">
              <button
                type="button"
                id="month-toggle"
                class="f-toggle"
                aria-expanded="false"
                aria-haspopup="listbox"
              >
                <span class="f-pill" id="month-pill">Tous les mois</span>
                <span class="f-caret" aria-hidden="true">▾</span>
              </button>
              <div
                id="month-menu"
                class="f-menu"
                role="listbox"
                aria-multiselectable="true"
              ></div>
            </div>
          </div>
          <div id="month-pills" class="month-pills" aria-label="Mois sélectionnés"></div>
          <div class="header-controls">
            <nav id="pagination-top" class="pagination pagination-top" aria-label="Pagination haut"></nav>
            <label for="page-size-select" class="page-size-label">Afficher
              <select id="page-size-select">
                <option value="9">9</option>
                <option value="18">18</option>
                <option value="36">36</option>
                <option value="all">Tout</option>
              </select>
            </label>
          </div>
        </div>
      </div>
      <div id="grid" class="grid">
        <p class="muted center">Chargement des actualités…</p>
      </div>
      <nav id="pagination" class="pagination" aria-label="Pagination bas"></nav>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
